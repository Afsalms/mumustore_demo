<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>My account · Mumu</title>
  <link rel="icon" href="assets/img/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="assets/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="assets/css/mumu.css">
</head>
<body>
  <div id="shellTop"></div>

  <main class="container py-3 py-md-4" style="max-width:900px">
    <div id="page"></div>
    <section class="mt-4" id="track">
      <div class="card-cute"><div class="card-body">
        <h2 class="h5 mb-1">Track an order</h2>
        <p class="small text-ink-soft fw-bold">Checked out as a guest? Enter your order ID and WhatsApp number.</p>
        <form id="trackForm" class="row g-2" novalidate>
          <div class="col-12 col-md-5"><label class="form-label" for="tId">Order ID</label><input class="form-control text-uppercase" id="tId" placeholder="MUMU-1015" required></div>
          <div class="col-12 col-md-4"><label class="form-label" for="tPhone">WhatsApp number</label><input class="form-control" id="tPhone" inputmode="numeric" maxlength="10" placeholder="10 digits" required></div>
          <div class="col-12 col-md-3 d-flex align-items-end"><button class="btn btn-pink w-100" type="submit">Track</button></div>
        </form>
        <div id="trackResult" class="mt-3" aria-live="polite"></div>
      </div></div>
    </section>
  </main>

  <div id="shellFoot"></div>

  <script src="assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="assets/js/art.js"></script>
  <script src="assets/js/data.js"></script>
  <script src="assets/js/store.js"></script>
  <script>
    Mumu.shell("account");
    var FLOW = ["new", "contacted", "confirmed", "packed", "shipped", "delivered"];
    function orderCard(o) {
      var idx = FLOW.indexOf(o.status), pct = o.status === "cancelled" ? 0 : Math.round(idx / (FLOW.length - 1) * 100);
      return '<div class="m-card"><div class="d-flex justify-content-between align-items-start gap-2 mb-2"><div><div class="fw-bold">' + o.id + '</div><div class="small text-ink-soft fw-bold">' + Mumu.date(o.at, true) + ' · ' + o.items.reduce(function (s, i) { return s + i.qty; }, 0) + ' items</div></div>' + Mumu.statusPill(o.status) + '</div>' +
        (o.status !== "cancelled" ? '<div class="progress mb-2" style="height:8px;border-radius:99px;background:#fdeef3" role="progressbar" aria-label="Order progress" aria-valuenow="' + pct + '" aria-valuemin="0" aria-valuemax="100"><div class="progress-bar" style="width:' + Math.max(6, pct) + '%;background:#f48cb6"></div></div>' : "") +
        '<div class="small text-ink-soft">' + o.items.map(function (i) { return Mumu.esc(i.name) + " × " + i.qty; }).join(", ") + '</div>' +
        '<div class="d-flex justify-content-between align-items-center mt-2"><span class="price">' + Mumu.money(o.total) + '</span>' + (o.courier ? '<span class="small fw-bold"><i class="bi bi-truck"></i> ' + Mumu.esc(o.courier) + '</span>' : "") + '</div></div>';
    }
    var u = Mumu.user(), page = document.getElementById("page"), mine = Mumu.myOrders();
    if (u) {
      page.innerHTML = '<div class="card-cute mb-4"><div class="card-body d-flex align-items-center gap-3"><img src="' + u.avatar + '" width="56" height="56" class="rounded-circle" alt="">' +
        '<div class="flex-grow-1 min-w-0"><h1 class="h4 mb-0">Hi, ' + Mumu.esc(u.name.split(" ")[0]) + '! 🐰</h1><div class="small text-ink-soft fw-bold text-truncate">' + Mumu.esc(u.email) + ' · signed in with Google</div></div>' +
        '<button class="btn btn-soft btn-sm" id="out">Sign out</button></div></div>' +
        '<div class="row g-3 mb-4"><div class="col-6"><a class="kpi" href="wishlist.html"><div class="lbl"><i class="bi bi-heart"></i>Wishlist</div><div class="val">' + Mumu.wish().length + '</div></a></div><div class="col-6"><div class="kpi"><div class="lbl"><i class="bi bi-bag"></i>Orders</div><div class="val">' + mine.length + '</div></div></div></div>' +
        '<h2 class="h5 section-title">My orders</h2>' + (mine.length ? mine.map(orderCard).join("") : '<div class="card-cute"><div class="empty py-4"><p class="fw-bold text-ink-soft mb-2">No orders yet.</p><a class="btn btn-pink" href="shop.html">Start shopping</a></div></div>');
      document.getElementById("out").onclick = function () { Mumu.signOut(); Mumu.flash("Signed out. See you soon! 👋"); location.reload(); };
    } else {
      page.innerHTML = '<div class="card-cute text-center"><div class="card-body p-4"><img src="assets/img/logo.png" width="84" alt="" class="mb-2"><h1 class="h4">Your Mumu account</h1><p class="small fw-bold text-ink-soft">Track orders, keep a wishlist and check out faster.</p>' +
        '<a class="btn btn-google d-inline-flex align-items-center gap-2" href="login.html?next=account.html">' + Mumu.googleIcon + ' Continue with Google</a></div></div>' +
        (mine.length ? '<h2 class="h5 section-title mt-4">Orders from this device</h2>' + mine.map(orderCard).join("") : "");
    }
    document.getElementById("trackForm").addEventListener("submit", function (e) {
      e.preventDefault();
      var id = document.getElementById("tId").value.trim().toUpperCase(), ph = document.getElementById("tPhone").value.replace(/\D/g, "");
      var o = Mumu.db().orders.filter(function (x) { return x.id === id && x.customer.phone === ph; })[0];
      document.getElementById("trackResult").innerHTML = o ? orderCard(o) : '<div class="alert alert-warning rounded-4 small fw-bold mb-0">We couldn’t find an order with that ID and number. Try again or message us on WhatsApp.</div>';
    });
  </script>
</body>
</html>
