<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Order · Mumu admin</title>
  <link rel="icon" href="../assets/img/favicon.png">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@500;700;800&display=swap">
  <link rel="stylesheet" href="../assets/vendor/bootstrap.min.css">
  <link rel="stylesheet" href="../assets/vendor/bootstrap-icons.min.css">
  <link rel="stylesheet" href="../assets/css/mumu.css">
</head>
<body class="admin-body">
  <div class="admin-shell">
    <div id="side"></div>
    <div>
      <div id="top"></div>
      <main class="admin-main" id="page"></main>
    </div>
  </div>

  <script src="../assets/vendor/bootstrap.bundle.min.js"></script>
  <script src="../assets/js/art.js"></script>
  <script src="../assets/js/data.js"></script>
  <script src="../assets/js/store.js" data-base="../"></script>
  <script src="../assets/js/admin.js"></script>
  <script>
    var id = Mumu.param("id");
    Mumu.adminShell("orders", id || "Order");
    var page = document.getElementById("page"), $ = function (x) { return document.getElementById(x); };

    function load() { var db = Mumu.db(); return { db: db, o: db.orders.filter(function (x) { return x.id === id; })[0] }; }

    // Moving into or out of "cancelled" gives stock back or takes it again.
    // Django: do this in the Order model's save/service inside transaction.atomic().
    function applyStatus(db, o, next) {
      if (next === o.status) return null;
      if (next === "cancelled" && !o.stockReturned) {
        o.items.forEach(function (i) { var p = Mumu.product(i.id, db); if (p) p.stock += i.qty; });
        o.stockReturned = true;
        o.history.push({ at: Date.now(), text: "Cancelled. " + o.items.reduce(function (s, i) { return s + i.qty; }, 0) + " items returned to stock." });
      } else if (o.status === "cancelled" && next !== "cancelled") {
        var short = o.items.filter(function (i) { var p = Mumu.product(i.id, db); return !p || p.stock < i.qty; });
        if (short.length) return "Can’t reopen: not enough stock for " + short.map(function (i) { return i.name; }).join(", ") + ".";
        o.items.forEach(function (i) { Mumu.product(i.id, db).stock -= i.qty; });
        o.stockReturned = false;
        o.history.push({ at: Date.now(), text: "Reopened. Stock taken again." });
      }
      o.history.push({ at: Date.now(), text: "Status → " + Mumu.STATUS[next].label });
      o.status = next; return null;
    }

    function render(editAddr, confirmCancel) {
      var x = load(), o = x.o;
      if (!o) { page.innerHTML = '<div class="card-cute"><div class="empty"><h2 class="h5">Order not found</h2><a class="btn btn-pink" href="orders.html">Back to orders</a></div></div>'; return; }
      var first = o.customer.name.split(" ")[0], a = o.address;
      var waConfirm = "Hi " + first + "! 🐰 Thank you for ordering from Mumu.\n\nOrder: " + o.id + "\n" + o.items.map(function (i) { return "• " + i.name + " × " + i.qty; }).join("\n") + "\nTotal: " + Mumu.money(o.total) + "\n\nPlease pay by UPI to mumu@upi and share a screenshot here. We’ll pack it right away 💗";
      var waShip = "Hi " + first + "! Your Mumu order " + o.id + " is on its way 🚚" + (o.courier ? "\nTracking: " + o.courier : "") + "\n\nThank you for shopping with us 🎀";
      var waPaid = "Hi " + first + "! We’ve received your payment for " + o.id + " 💗 Packing your goodies now!";
      var opts = Object.keys(Mumu.STATUS).map(function (s) { return '<option value="' + s + '"' + (s === o.status ? " selected" : "") + '>' + Mumu.STATUS[s].label + '</option>'; }).join("");

      page.innerHTML =
        '<a href="orders.html" class="small fw-bold text-decoration-none d-inline-block mb-2"><i class="bi bi-arrow-left"></i> All orders</a>' +
        '<div class="d-flex flex-wrap align-items-center gap-2 mb-3"><h2 class="h4 mb-0 me-1">' + o.id + '</h2>' + Mumu.statusPill(o.status) + Mumu.payPill(o.payment) + (o.customer.guest ? '<span class="pill pill-cancelled">Guest checkout</span>' : "") + '<span class="small fw-bold text-ink-soft w-100 w-sm-auto">Placed ' + Mumu.date(o.at, true) + ' · ' + Mumu.ago(o.at) + '</span></div>' +
        '<div class="row g-3">' +
        '<div class="col-12 col-lg-7">' +
          // WhatsApp
          '<div class="card-cute mb-3"><div class="card-body"><h3 class="h6 mb-1"><i class="bi bi-whatsapp text-success"></i> Message on WhatsApp</h3><p class="small text-ink-soft mb-3">Opens WhatsApp with the message filled in. Number: <b>+91 ' + o.customer.phone + '</b></p>' +
            '<div class="d-grid d-sm-flex flex-wrap gap-2"><a class="btn btn-whatsapp btn-sm" href="' + Mumu.waLink(o.customer.phone, waConfirm) + '"><i class="bi bi-whatsapp"></i> Confirm & ask payment</a>' +
            '<a class="btn btn-soft btn-sm" href="' + Mumu.waLink(o.customer.phone, waPaid) + '">Payment received</a>' +
            '<a class="btn btn-soft btn-sm" href="' + Mumu.waLink(o.customer.phone, waShip) + '">Shipped + tracking</a>' +
            '<a class="btn btn-soft btn-sm" href="' + Mumu.waLink(o.customer.phone, "Hi " + first + "! ") + '">Blank message</a></div></div></div>' +
          // update form
          '<form class="card-cute mb-3" id="upd"><div class="card-body"><h3 class="h6 mb-3">Update order</h3><div class="row g-3">' +
            '<div class="col-6"><label class="form-label" for="status">Order status</label><select class="form-select" id="status">' + opts + '</select></div>' +
            '<div class="col-6"><label class="form-label" for="payment">Payment</label><select class="form-select" id="payment"><option value="unpaid"' + (o.payment === "unpaid" ? " selected" : "") + '>Unpaid</option><option value="paid"' + (o.payment === "paid" ? " selected" : "") + '>Paid</option></select></div>' +
            '<div class="col-12"><label class="form-label" for="courier">Courier & tracking no.</label><input class="form-control" id="courier" value="' + Mumu.esc(o.courier) + '" placeholder="e.g. India Post · EK123456789IN"></div>' +
            '<div class="col-12"><label class="form-label" for="adminNote">Private note <span class="fw-normal text-ink-soft">(only admins see this)</span></label><textarea class="form-control" id="adminNote" rows="2" placeholder="Paid via GPay, ref 4521…">' + Mumu.esc(o.adminNote) + '</textarea></div>' +
            '<div class="col-12" id="updMsg"></div>' +
            '<div class="col-12 d-flex gap-2"><button class="btn btn-pink" type="submit">Save changes</button>' + (o.status !== "cancelled" ? '<button class="btn btn-link text-danger fw-bold ms-auto" type="button" id="askCancel">Cancel order</button>' : "") + '</div>' +
          '</div></div></form>' +
          (confirmCancel ? '<div class="confirm-box mb-3" id="cancelBox"><h3 class="h6 text-danger mb-1">Cancel ' + o.id + '?</h3><p class="small mb-3">The order is marked cancelled and its ' + o.items.reduce(function (s, i) { return s + i.qty; }, 0) + ' items go back into stock. You can reopen it later if stock allows.</p><div class="d-flex gap-2"><button class="btn btn-danger btn-sm" id="doCancel" type="button">Yes, cancel order</button><button class="btn btn-soft btn-sm" id="keep" type="button">Keep order</button></div></div>' : "") +
          // items
          '<div class="card-cute mb-3"><div class="card-body"><h3 class="h6 mb-3">Items</h3>' +
            o.items.map(function (i) { var p = Mumu.product(i.id, x.db); return '<div class="line-item"><span class="thumb-sm">' + (p ? MumuArt.svg(p) : "") + '</span><div class="flex-grow-1 small"><a class="fw-bold text-decoration-none" style="color:inherit" href="product.html?id=' + i.id + '">' + Mumu.esc(i.name) + '</a><div class="text-ink-soft fw-bold">' + Mumu.money(i.price) + ' × ' + i.qty + (p ? ' · now ' + p.stock + ' in stock' : "") + '</div></div><b>' + Mumu.money(i.price * i.qty) + '</b></div>'; }).join("") +
            '<div class="divider-dash my-3"></div><div class="sum-row small"><span>Subtotal</span><b>' + Mumu.money(o.subtotal) + '</b></div><div class="sum-row small"><span>Shipping</span><b>' + (o.shipping ? Mumu.money(o.shipping) : "Free") + '</b></div><div class="sum-row total"><span>Total</span><span class="text-pink">' + Mumu.money(o.total) + '</span></div>' +
            (o.note ? '<div class="mt-3 p-2 rounded-4 bg-blush small"><b>Customer note:</b> ' + Mumu.esc(o.note) + '</div>' : "") +
          '</div></div>' +
        '</div>' +
        '<div class="col-12 col-lg-5">' +
          '<div class="card-cute mb-3"><div class="card-body">' +
            '<div class="d-flex justify-content-between align-items-center mb-2"><h3 class="h6 mb-0">Customer & delivery</h3>' + (editAddr ? "" : '<button class="btn btn-soft btn-sm" id="editAddr" type="button"><i class="bi bi-pencil"></i> Edit</button>') + '</div>' +
            (editAddr
              ? '<form id="addrForm" class="row g-2" novalidate>' +
                  [["cName", "Name", o.customer.name, "col-12"], ["cPhone", "WhatsApp", o.customer.phone, "col-6"], ["cEmail", "Email", o.customer.email, "col-6"], ["aLine1", "House / building", a.line1, "col-12"], ["aLine2", "Street / area", a.line2, "col-12"], ["aLandmark", "Landmark", a.landmark, "col-12"], ["aCity", "City", a.city, "col-6"], ["aPin", "PIN", a.pin, "col-6"], ["aState", "State", a.state, "col-12"]].map(function (f) {
                    return '<div class="' + f[3] + '"><label class="form-label small" for="' + f[0] + '">' + f[1] + '</label><input class="form-control" id="' + f[0] + '" value="' + Mumu.esc(f[2]) + '"' + (/cName|cPhone|aLine1|aCity|aPin|aState/.test(f[0]) ? " required" : "") + (f[0] === "cPhone" ? ' pattern="[6-9][0-9]{9}" maxlength="10"' : f[0] === "aPin" ? ' pattern="[1-9][0-9]{5}" maxlength="6"' : "") + '></div>';
                  }).join("") +
                  '<div class="col-12 d-flex gap-2 mt-2"><button class="btn btn-pink btn-sm" type="submit">Save details</button><button class="btn btn-soft btn-sm" type="button" id="cancelEdit">Cancel</button></div></form>'
              : '<div class="small"><div class="fw-bold fs-6">' + Mumu.esc(o.customer.name) + '</div><div class="text-ink-soft fw-bold mb-2">+91 ' + o.customer.phone + (o.customer.email ? ' · ' + Mumu.esc(o.customer.email) : "") + '</div>' +
                  Mumu.esc([a.line1, a.line2, a.landmark].filter(Boolean).join(", ")) + '<br>' + Mumu.esc(a.city + ", " + a.state + " – " + a.pin) + '</div>' +
                  '<div class="d-flex gap-2 mt-3"><button class="btn btn-soft btn-sm" type="button" id="copyAddr"><i class="bi bi-copy"></i> Copy address</button></div>') +
          '</div></div>' +
          '<div class="card-cute"><div class="card-body"><h3 class="h6 mb-3">History</h3><ul class="timeline">' +
            o.history.slice().reverse().map(function (h) { return '<li><b>' + Mumu.esc(h.text) + '</b><div class="text-ink-soft small">' + Mumu.date(h.at, true) + '</div></li>'; }).join("") +
          '</ul></div></div>' +
        '</div></div>';

      $("upd").addEventListener("submit", function (e) {
        e.preventDefault();
        var x = load(), o = x.o, err = applyStatus(x.db, o, $("status").value);
        if (err) { $("updMsg").innerHTML = '<div class="alert alert-warning rounded-4 small fw-bold mb-0">' + Mumu.esc(err) + '</div>'; return; }
        if ($("payment").value !== o.payment) { o.payment = $("payment").value; o.history.push({ at: Date.now(), text: "Payment → " + (o.payment === "paid" ? "Paid" : "Unpaid") }); }
        var c = $("courier").value.trim(); if (c !== o.courier) { o.courier = c; if (c) o.history.push({ at: Date.now(), text: "Tracking added: " + c }); }
        o.adminNote = $("adminNote").value.trim();
        Mumu.save(x.db); Mumu.flash("Order " + o.id + " saved ✓"); location.reload();
      });
      var ask = $("askCancel"); if (ask) ask.onclick = function () { render(false, true); setTimeout(function () { $("cancelBox").scrollIntoView({ behavior: "smooth", block: "center" }); }, 30); };
      if (confirmCancel) {
        $("keep").onclick = function () { render(); };
        $("doCancel").onclick = function () { var x = load(); applyStatus(x.db, x.o, "cancelled"); Mumu.save(x.db); Mumu.flash("Order cancelled · stock returned"); location.reload(); };
      }
      if ($("editAddr")) $("editAddr").onclick = function () { render(true); };
      if ($("copyAddr")) $("copyAddr").onclick = function () {
        var txt = o.customer.name + "\n+91 " + o.customer.phone + "\n" + [a.line1, a.line2, a.landmark].filter(Boolean).join(", ") + "\n" + a.city + ", " + a.state + " - " + a.pin, b = this;
        try { navigator.clipboard.writeText(txt).then(function () { b.innerHTML = '<i class="bi bi-check2"></i> Copied'; }, function () { Mumu.toast("Couldn’t copy here"); }); } catch (e) { Mumu.toast("Couldn’t copy here"); }
      };
      if (editAddr) {
        $("cancelEdit").onclick = function () { render(); };
        $("addrForm").addEventListener("submit", function (e) {
          e.preventDefault(); this.classList.add("was-validated"); if (!this.checkValidity()) return;
          var x = load(), o = x.o, v = function (k) { return $(k).value.trim(); };
          o.customer.name = v("cName"); o.customer.phone = v("cPhone"); o.customer.email = v("cEmail");
          o.address = { line1: v("aLine1"), line2: v("aLine2"), landmark: v("aLandmark"), city: v("aCity"), state: v("aState"), pin: v("aPin") };
          o.history.push({ at: Date.now(), text: "Customer details edited" });
          Mumu.save(x.db); Mumu.flash("Details updated ✓"); location.reload();
        });
      }
    }
    render();
  </script>
</body>
</html>
